[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-prompting-system"
version = "0.2.0"
description = "A sophisticated prompting engine leveraging multi-agent collaboration, complexity planning, and adaptive reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "dhar174" }
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "flask>=3.0.0",
    "strawberry-graphql[flask]>=0.200.0",
    "tqdm>=4.65.0",
    "regex>=2023.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "jarowinkler>=2.0.0",
    "Levenshtein>=0.21.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
nlp = [
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    "textblob>=0.17.0",
    "textstat>=0.7.0",
    "tiktoken>=0.5.0",
    "transformers>=4.30.0",
]
dev = [
    "advanced-prompting-system[test]",
    "advanced-prompting-system[nlp]",
]

[tool.pytest.ini_options]
norecursedirs = [
    ".qualification",
    "historical_verification",
    "node_modules",
    "collaborative-assistant-frontend",
    ".git",
    "__pycache__",
]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-ra"
