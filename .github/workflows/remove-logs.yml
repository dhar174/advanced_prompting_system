name: Delete Debug Complexity Logs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect root directory
        run: |
          echo "=== Root directory contents ==="
          ls -la
          echo "=== Glob search in root ==="
          ls -d ./debug_log_complexity* 2>/dev/null || echo "No direct match found via glob"

      - name: Delete matched files
        run: |
          # 1. Match both tracked and untracked/ignored files case-insensitively
          find . -maxdepth 1 -type f -iname 'debug_log_complexity*' | while IFS= read -r file; do
            echo "Deleting: $file"
            # Remove from git index if tracked, otherwise regular rm
            git rm -f --ignore-unmatch "$file" 2>/dev/null || rm -f "$file"
          done

      - name: Commit and push changes
        run: |
          # Stage any unstaged deletions as well
          git add -u

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove debug_log_complexity files"
            git push
          else
            echo "No changes staged to commit."
          fi
