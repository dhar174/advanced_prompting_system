name: Test Suite (Offline Qualification)

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm

      - name: Run offline test suite
        run: |
          chmod +x tools/run-offline.sh
          ./tools/run-offline.sh --ignore=test_browser_e2e.py -q

  frontend-test:
    name: Frontend Tests & Lint (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: collaborative-assistant-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: collaborative-assistant-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify network denial guard
        run: |
          chmod +x ../tools/run-frontend-offline.sh
          ../tools/run-frontend-offline.sh guard

      - name: Run ESLint
        run: ../tools/run-frontend-offline.sh lint

      - name: Run Vitest Suite
        run: ../tools/run-frontend-offline.sh test

      - name: Run TypeScript & Vite Build
        run: ../tools/run-frontend-offline.sh build

  browser-e2e:
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.qualification/browsers
    name: Offline Browser E2E (Chromium + WSGI Check)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: collaborative-assistant-frontend/package-lock.json

      - name: Build frontend SPA offline
        run: |
          cd collaborative-assistant-frontend
          npm ci
          chmod +x ../tools/run-frontend-offline.sh
          ../tools/run-frontend-offline.sh build

      - name: Install Python backend & Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e,server]"
          python -m spacy download en_core_web_sm
          python -m playwright install chromium --with-deps
          python -c "from pathlib import Path; from playwright.sync_api import sync_playwright; p=sync_playwright().start(); assert Path(p.chromium.executable_path).is_file(); p.stop()"

      - name: Compile WSGI & E2E harness modules
        run: |
          python -m py_compile wsgi.py tools/e2e/provider_fixture.py tools/e2e/server_runner.py

      - name: Run offline Playwright browser E2E suite
        run: |
          chmod +x tools/run-offline.sh
          ./tools/run-offline.sh test_browser_e2e.py -v

      - name: Upload E2E provider ledger & artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-qualification-logs
          path: .qualification/logs/
          if-no-files-found: ignore

  production-image:
    name: Production runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tracked source image
        run: git archive HEAD | docker build -t aps-qualified -
      - name: Qualify runtime without outbound network
        run: >-
          docker run --rm --network none
          -v "$PWD:/qualification:ro"
          -e PYTHONPATH=/qualification/tools/offline:/app:/qualification
          -e APS_OFFLINE_TESTS=1 -e OFFLINE_MODE=1
          aps-qualified python /qualification/tools/e2e/runtime_smoke.py
